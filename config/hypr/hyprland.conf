# █▀▀ █▄░█ █░█   █░█ ▄▀█ █▀█
# ██▄ █░▀█ ▀▄▀   ▀▄▀ █▀█ █▀▄

# -----------------------------------------------------
# Monitor
# -----------------------------------------------------
monitor=eDP-1,1920x1080@60.0,0x0,1

# -----------------------------------------------------
# Autostart (Gestionado por UWSM / Systemd)
# -----------------------------------------------------
exec-once = uwsm app -- swaybg -m fit -i $HOME/Desktop/Fondos/balcony.jpg
# foot --server eliminado: terminal principal es kitty
exec-once = uwsm app -- wlsunset -l 40.4 -L -3.7
exec-once = uwsm app -- swaync

# -----------------------------------------------------
# Input
# -----------------------------------------------------
input {
  kb_layout = es
  follow_mouse = 0
  mouse_refocus = 0 
  sensitivity = 0.2 
  force_no_accel = false
  float_switch_override_focus = 1
  accel_profile = flat
  natural_scroll = true

  touchpad {
        natural_scroll = true 
        disable_while_typing = true
        tap-to-click = true
        drag_lock = false
        scroll_factor = 1.0
  }
}

# -----------------------------------------------------
# General
# -----------------------------------------------------
general {
  gaps_in = 5
  gaps_out = 5
  border_size = 1
  col.active_border = rgba(ffffff90) rgba(87ceeb90) 45deg 1
  col.inactive_border = rgba(382d2e9f)
  # layout = dwindle
}

# -----------------------------------------------------
# Misc
# -----------------------------------------------------
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  vfr = true
  vrr = 0
  animate_manual_resizes = true
  mouse_move_focuses_monitor = true
  enable_swallow = true
  swallow_regex = ^(kitty)$
}

# -----------------------------------------------------
# XWayland
# -----------------------------------------------------
xwayland {
  force_zero_scaling = true
}

# -----------------------------------------------------
# Layouts
# -----------------------------------------------------
dwindle {
  pseudotile = true 
  preserve_split = true 
}

master {
    new_status = master
    orientation = left
}

# ----------------------------------------------------- 
animations {
    enabled = yes
    bezier = wind, 0.09, 0.9, 0.1, 1.05
    bezier = winIn, 0.2, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, once
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

# -----------------------------------------------------
# Decoration
# -----------------------------------------------------
decoration {
    rounding = 15
    active_opacity = 0.90
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(0, 0, 0, 0.55)
    }
}

# -----------------------------------------------------
# Cursor
# -----------------------------------------------------
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
    no_warps = false
}

# -----------------------------------------------------
# Layer Rules
# -----------------------------------------------------
layerrule {
    name = waybar-blur
    match:namespace = waybar
    blur = on
    ignore_alpha = 0.3
}

layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0, match:namespace wofi

layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications

layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window

layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center

layerrule = blur on, match:namespace logout_dialog

# -----------------------------------------------------
# Window Rules
# -----------------------------------------------------
windowrule {
    name = xtra-menu
    match:title = ^(Xtra Menu)$
    float = on
    no_anim = on
    decorate = off
    no_shadow = on
    rounding = 12
}

windowrule {
    name = kitty-rule
    match:initial_class = ^(kitty)$
    float = on
    size = 1220 780
    center = on
    workspace = 1
}

windowrule {
    name = picture-in-picture
    match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
    float = on
    keep_aspect_ratio = on
    move = (monitor_w*0.73) (monitor_h*0.72)
    size = (monitor_w*0.25) (monitor_h*0.25)
    pin = on
}

# Terminales y editores — más transparentes
windowrule = opacity 0.80 0.80 1, match:class ^(kitty)$
windowrule = opacity 0.80 0.80 1, match:class ^([Cc]ode)$

# Browsers — ligeramente transparentes
windowrule = opacity 0.90 0.90 1, match:class ^(firefox)$
windowrule = opacity 0.90 0.90 1, match:class ^(chromium)$

# Media — transparentes en inactivo
windowrule = opacity 0.70 0.70 1, match:class ^([Ss]potify)$

# Utilidades — transparentes
windowrule = opacity 0.80 0.70 1, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.80 0.70 1, match:class ^(blueman-manager)$
windowrule = opacity 0.80 0.70 1, match:class ^(nwg-look)$

# Idle inhibit para media players
windowrule = idle_inhibit fullscreen true, match:class ^(.*mpv.*)$|^(.*vlc.*)$|^(.*celluloid.*)$
windowrule = idle_inhibit fullscreen true, match:class ^(.*firefox.*)$|^(.*chromium.*)$

# -----------------------------------------------------
# Keybindings
# -----------------------------------------------------
$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts

bind = ALT, Tab, cyclenext, visible hist

# Swap Workspaces
bind = $mainMod, Tab, exec, $HYPRSCRIPTS/workspace_toggle.sh

# --- System & Apps (Encapsulados con uwsm app) ---
bind = $mainMod, Return, exec, uwsm app -- kitty
bind = $mainMod, D, exec, uwsm app -- ~/.config/hypr/scripts/wofi_uwsm.sh
bind = $mainMod, Q, killactive
bind = ALT, F4, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, J, togglesplit
bind = $mainMod, G, togglegroup

# --- Scratchpad ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Focus & Move ---
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

bind = $mainMod ALT, Left, movewindow, l
bind = $mainMod ALT, Right, movewindow, r
bind = $mainMod ALT, Up, movewindow, u
bind = $mainMod ALT, Down, movewindow, d

bindm = SUPER, mouse:272, movewindow

# --- Resize ---
binde = $mainMod SHIFT, Right, resizeactive, 50 0
binde = $mainMod SHIFT, Left, resizeactive, -50 0
binde = $mainMod SHIFT, Down, resizeactive, 0 50
binde = $mainMod SHIFT, Up, resizeactive, 0 -50

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Mouse & Scroll Workspaces ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Screenshot & Scripts ---
bind = ,Print, exec, $HYPRSCRIPTS/screenshot.sh full
bind = $mainMod SHIFT, S, exec, $HYPRSCRIPTS/screenshot.sh gui
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod SHIFT, W, exec, uwsm app -- ~/.config/hypr/scripts/waypaper.sh --random
bind = $mainMod CTRL, W, exec, uwsm app -- ~/.config/hypr/scripts/waypaper.sh
bind = $mainMod CTRL, L, exec, uwsm app -- ~/.config/hypr/scripts/power.sh lock

# --- Fn Keys (Comandos efímeros, sin uwsm) ---
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86KbdBrightnessUp, exec, brightnessctl set +1 --device='asus::kbd_backlight'
bind = , XF86KbdBrightnessDown, exec, brightnessctl set 1- --device='asus::kbd_backlight'
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous


bindm = SUPER, mouse:273, resizewindow
